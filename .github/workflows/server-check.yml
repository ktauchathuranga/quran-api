name: Quran API Server Status Check

on:
  push:
    branches:
      - main
  schedule:
      - cron: "0 */5 * * *" # Runs every 5 hours

jobs:
  check-server-status:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Send POST request to Quran API
      id: post-request
      run: |
        response=$(curl -s -X POST https://quran.x10.mx/ \
          -H "Content-Type: application/json" \
          -d '{"action": "getVerseDetails", "chapter": 1, "verse": 1, "edition_id": 20}')
        echo "API_RESPONSE=$response" >> $GITHUB_ENV

    - name: Parse API response
      id: parse-response
      run: |
        status=$(echo "$API_RESPONSE" | jq -r .status)
        if [ "$status" == "success" ]; then
          echo "SERVER_STATUS=up" >> $GITHUB_ENV
        else
          echo "SERVER_STATUS=down" >> $GITHUB_ENV
        fi
    
    - name: Update README.md
      run: |
        # Define the initial status
        if [ "$SERVER_STATUS" == "up" ]; then
          status_text="**Server Status:** ✅ **| Up and Running... hooray!**"
        else
          status_text="**Server Status:** ❌ **| Down... 🥺**"
        fi

        # Use `awk` for safer replacement in README.md
        awk -v status="$status_text" '
        BEGIN {found = 0}
        /\*\*Server Status:\*\*/ {
          print status
          found = 1
          next
        }
        {print}
        END {
          if (found == 0) print status
        }' README.md > README.md.tmp

        mv README.md.tmp README.md

        
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "79928743+ktauchathuranga@users.noreply.github.com"

        git add README.md
        git commit -m "Update server status"
        git push
