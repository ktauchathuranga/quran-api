services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quran
    volumes:
      - ./quran.sql:/docker-entrypoint-initdb.d/quran.sql
    ports:
      - "3306:3306"
    command:
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=128M
      - --net_buffer_length=16K
